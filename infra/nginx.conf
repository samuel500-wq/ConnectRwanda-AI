# ====================================================================
# ConnectRwanda AI — Production Reverse Proxy Configuration
# Supports both:
#   Option A (Recommended): Host-Based Subdomain Routing
#   Option B: Path-Based Routing with BasePaths
# ====================================================================

# --------------------------------------------------------------------
# OPTION A (RECOMMENDED): Host-Based Subdomain Routing
# Preserves 100% of internal client fetches, cookies, and static assets
# --------------------------------------------------------------------

# 1. Main Landing Platform (connectrwanda.ai)
server {
    listen 80;
    listen 443 ssl http2;
    server_name connectrwanda.ai www.connectrwanda.ai;

    # SSL Certificates (Managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/connectrwanda.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/connectrwanda.ai/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. RouteView Mobility & Transit (routeview.connectrwanda.ai)
server {
    listen 80;
    listen 443 ssl http2;
    server_name routeview.connectrwanda.ai;

    # Frontend Next.js Client
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RouteView Backend Express API
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RouteView ML Arrival Prediction Service
    location /ml/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. MapForAll Accessibility & Discovery (mapforall.connectrwanda.ai)
server {
    listen 80;
    listen 443 ssl http2;
    server_name mapforall.connectrwanda.ai;

    # Client Next.js App
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google ADK Agent SSE / Stream endpoints (if proxying ADK locally)
    location /adk/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --------------------------------------------------------------------
# OPTION B: Path-Based Single-Domain Routing (Proxy Variant)
# --------------------------------------------------------------------
server {
    listen 8088;
    server_name connectrwanda.local;

    # Unified Landing Page
    location = / {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RouteView Frontend (Preserves basePath prefix)
    location /routeview/ {
        proxy_pass http://127.0.0.1:3000/routeview/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /routeview;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MapForAll Client (Preserves basePath prefix)
    location /mapforall/ {
        proxy_pass http://127.0.0.1:3001/mapforall/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /mapforall;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RouteView Backend API (Prefix stripped)
    location /api/routeview/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RouteView ML Service (Prefix stripped)
    location /api/ml/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
